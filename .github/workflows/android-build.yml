name: Build Special Ops Android

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Install Android build template
        run: godot --headless --path . --editor --quit --install-android-build-template

      - name: Verify Android build template
        run: test -d .godot && find .godot -maxdepth 3 -type f -print | head -100

      - name: Export Android debug APK
        run: mkdir -p build && godot --headless --path . --editor --quit-after 10 --export-debug Android build/Special-Ops-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Special-Ops-debug
          path: build/Special-Ops-debug.apk
          if-no-files-found: error
