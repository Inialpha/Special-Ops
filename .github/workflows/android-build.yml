name: Build Special Ops Android

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest cmake;3.10.2.4988404 ndk;23.2.8568313'

      - name: Install Godot 4.4.1 and standard export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Configure Godot Android SDK and Java paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create CI debug keystore
        shell: bash
        run: |
          mkdir -p build
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/build/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -e
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -d "$ANDROID_SDK_ROOT/cmake/3.10.2.4988404"
          test -d "$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          test -n "$JAVA_HOME"
          test -f "$GITHUB_WORKSPACE/build/debug.keystore"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" version
          java -version

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Inspect Android export configuration
        shell: bash
        run: |
          echo '--- Android export preset ---'
          sed -n '/\[preset.0\]/,$p' export_presets.cfg
          echo '--- Godot version ---'
          godot --version

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/build/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/Special-Ops-debug.apk
          test -s build/Special-Ops-debug.apk
          file build/Special-Ops-debug.apk
          ls -lh build/Special-Ops-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Special-Ops-debug
          path: build/Special-Ops-debug.apk
          if-no-files-found: error
