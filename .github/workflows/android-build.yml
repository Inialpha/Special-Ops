name: Build Special Ops Android

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Configure Godot Android SDK and Java paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Verify Android toolchain
        shell: bash
        run: |
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -d "$ANDROID_SDK_ROOT/platforms"
          test -d "$ANDROID_SDK_ROOT/build-tools"
          test -n "$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          java -version

      - name: Validate project
        run: godot --headless --path . --editor --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit-after 10 --export-debug Android build/Special-Ops-debug.apk
          test -s build/Special-Ops-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Special-Ops-debug
          path: build/Special-Ops-debug.apk
          if-no-files-found: error
