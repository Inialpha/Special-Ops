name: Build Special Ops Android

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install Godot 4.4.1 and standard export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Configure Godot 4.4 editor settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          settings_file="$HOME/.config/godot/editor_settings-4.4.tres"

          cat > "$settings_file" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "Godot editor settings: $settings_file"
          cat "$settings_file"

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/build/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -n "$JAVA_HOME"
          test -f "$GITHUB_WORKSPACE/build/debug.keystore"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" version
          java -version

      - name: Validate Godot project
        run: godot --headless --path . --editor --quit

      - name: Inspect Android export configuration
        shell: bash
        run: |
          set -euo pipefail
          echo '--- Godot version ---'
          godot --version
          echo '--- Export preset ---'
          cat export_presets.cfg
          echo '--- Relevant Godot settings ---'
          grep -R "export/android/" "$HOME/.config/godot" || true
          echo '--- Godot export templates ---'
          find "$HOME/.local/share/godot/export_templates/4.4.1.stable" -maxdepth 2 -type f -print | sort | head -200

      - name: Export Android debug APK
        id: export
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/build/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --verbose --log-file build/godot-export.log \
            --path . \
            --export-debug "Android" \
            build/Special-Ops-debug.apk
          test -s build/Special-Ops-debug.apk
          file build/Special-Ops-debug.apk
          ls -lh build/Special-Ops-debug.apk

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Special-Ops-build-diagnostics
          path: |
            build/Special-Ops-debug.apk
            build/godot-export.log
            $HOME/.config/godot/editor_settings-4.4.tres
          if-no-files-found: warn
